# -*- coding: utf-8 -*-
# Copyright 2026  Admin AI Team, All rights reserved.
#
# 项目依赖与工具链的唯一真相源（single source of truth）。
# requirements.txt / requirements-dev.txt 均由本文件派生，请使用 uv pip compile 生成，
# 不要手工编辑这两个文件。

[project]
name = "admin-ai-agent"
version = "0.1.0"
description = "企业行政智能系统 - AI 行政数字员工"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Admin AI Team"},
]
keywords = ["ai", "agent", "enterprise", "admin", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # LLM & AI
    "openai>=1.50.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",

    # RAG
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # Task Queue
    "celery>=5.4.0",

    # HTTP Client
    "httpx>=0.27.0",

    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Logging
    "structlog>=24.4.0",

    # Monitoring
    "prometheus-fastapi-instrumentator>=7.0.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "faker>=30.0.0",
    "locust>=2.32.0",

    # Code Quality
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.8.0",
]

[project.urls]
Homepage = "https://gitee.com/qiulongfei4408/admin-ai-agent"
Documentation = "https://gitee.com/qiulongfei4408/admin-ai-agent/tree/main/docs"
Repository = "https://gitee.com/qiulongfei4408/admin-ai-agent"
Issues = "https://gitee.com/qiulongfei4408/admin-ai-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================
# 工具链：ruff（format + lint）+ mypy + pytest + pre-commit
# 已移除 black / isort / flake8，统一由 ruff 承担。
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, N: pep8-naming,
# UP: pyupgrade, B: flake8-bugbear, SIM: flake8-simplify
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# 行长由 ruff format 负责，忽略 E501 避免与 formatter 冲突
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
# pydantic 作为运行依赖提供 pydantic.mypy 插件，无需额外安装 mypy 插件包。
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "celery.*",
    "passlib.*",
    "jose.*",
    "locust.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# 默认只跑不依赖外部服务的用例；集成/端到端/真实 LLM 用例按需用 -m 显式选择
addopts = '-v --tb=short --strict-markers --disable-warnings -m "not integration and not e2e and not llm"'
# 与 --strict-markers 配套；未在此注册的 marker 会导致测试失败
markers = [
    "slow: 慢速测试",
    "integration: 集成测试（依赖数据库 / Redis 等外部服务）",
    "e2e: 端到端测试（完整业务流程）",
    "llm: 依赖真实 LLM 调用的测试（CI 默认不执行）",
]

# ============================================================
# 覆盖率口径（与 docs/guides/开发规范.md、docs/guides/测试计划.md 对齐）：
#   Core    (app/admin_ai/core)     >= 90%
#   Service (app/admin_ai/services) >= 85%
#   API     (app/admin_ai/api)      >= 80%
#   整体                            >= 80%（CI: pytest --cov-fail-under=80）
# ============================================================
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/*/main.py",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
