[project]
name = "admin-ai-agent"
version = "0.1.0"
description = "企业行政智能系统 - AI 行政数字员工"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Admin AI Team"},
]
keywords = ["ai", "agent", "enterprise", "admin", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    
    # Redis
    "redis[hiredis]>=5.0.0",
    
    # LLM & AI
    "openai>=1.50.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    
    # RAG
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    
    # Task Queue
    "celery>=5.4.0",
    
    # HTTP Client
    "httpx>=0.27.0",
    
    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    
    # Logging
    "structlog>=24.4.0",
    
    # Monitoring
    "prometheus-fastapi-instrumentator>=7.0.0",
    
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://gitee.com/qiulongfei4408/admin-ai-agent"
Documentation = "https://gitee.com/qiulongfei4408/admin-ai-agent/tree/main/docs"
Repository = "https://gitee.com/qiulongfei4408/admin-ai-agent"
Issues = "https://gitee.com/qiulongfei4408/admin-ai-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
known_first_party = ["app"]
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers --disable-warnings"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]